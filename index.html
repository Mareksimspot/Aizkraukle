<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5fbfa" />
    <title>Aizkraukles klīnika — ārstu pieņemšanas laiki</title>
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <main class="signage">
      <section class="timetable-panel">
        <header class="page-header">
          <div class="logo-card">
            <img class="logo" src="clinic-logo.svg" alt="Aizkraukles klīnika" />
          </div>
          <div class="clock-card" aria-label="Pašreizējais datums un laiks">
            <div class="calendar">
              <span id="date"></span>
              <span id="weekday"></span>
            </div>
            <time id="time"></time>
          </div>
        </header>

        <div class="title-row">
          <h1>Ārstu pieņemšanas laiki</h1>
          <span id="screen-number" class="screen-number"></span>
        </div>

        <section id="schedule" class="schedule" aria-live="polite">
          <p class="loading">Ielādē pieņemšanas laikus…</p>
        </section>
      </section>

      <section id="advertisement" class="advertisement" aria-label="Reklāma">
        <div id="ad-placeholder" class="ad-placeholder">
          <span class="info-icon" aria-hidden="true">i</span>
          <div>
            <strong>Informācija</strong>
            <p>Lūdzam ierasties 10 minūtes pirms pierakstītā vizītes laika.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js?v=8"></script>
  </body>
</html>
